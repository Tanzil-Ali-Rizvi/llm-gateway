name: Benchmarks

# Reliability/cache benchmark (simulated providers) + semantic-cache threshold study (QQP + bge-small).
# Results are committed to benchmarks/results so every number in the README is versioned.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[semantic]" datasets
      - run: python benchmarks/chaos.py --out benchmarks/results
      - run: python benchmarks/semantic_threshold.py --out benchmarks/results
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results
          git diff --cached --quiet && echo "no changes" || (git commit -m "Benchmark results from CI" && git pull --rebase && git push)
